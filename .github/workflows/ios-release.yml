name: iOS release

# Archives a signed .ipa and (optionally) uploads it to App Store Connect /
# TestFlight. Manually triggered — never on push, because every run costs
# macOS runner minutes at a 10x multiplier and every upload burns a build
# number.
#
# Signing is MANUAL on purpose. Automatic signing (-allowProvisioningUpdates)
# would ask Apple to mint a fresh distribution certificate on each ephemeral
# runner, and Apple caps you at 3 — you would lock yourself out within a few
# runs. So the certificate and profile are created once and stored as secrets.
#
# Required secrets (see docs/ios-ci-setup.md to create them without a Mac):
#   APPLE_TEAM_ID               10-character team id, e.g. A1B2C3D4E5
#   APPLE_DIST_CERT_P12         base64 of the Apple Distribution .p12
#   APPLE_DIST_CERT_PASSWORD    password used when the .p12 was created
#   APPLE_PROVISIONING_PROFILE  base64 of the App Store .mobileprovision
# Required only for the upload step (leave unset to just get an .ipa artifact):
#   APPSTORE_API_KEY_ID         App Store Connect API key id
#   APPSTORE_API_ISSUER_ID      App Store Connect API issuer id
#   APPSTORE_API_PRIVATE_KEY    base64 of the AuthKey_XXXX.p8
#   APPSTORE_APP_ID             numeric app id (App Store Connect → App Information)

on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: 'Version shown in the App Store (blank = keep project value)'
        required: false
        type: string
      build_number:
        description: 'Build number (blank = use the workflow run number)'
        required: false
        type: string
      upload:
        description: 'Upload to App Store Connect (off = .ipa artifact only)'
        required: false
        type: boolean
        default: true

concurrency:
  group: ios-release
  cancel-in-progress: false

# Read-only token: this workflow builds and uploads to Apple, and must never
# be able to write to the repository.
permissions:
  contents: read

env:
  APP_BUNDLE_ID: com.tjdoolittle.verseadvocate

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Show toolchain
        run: xcodebuild -version

      - run: npm ci

      - name: Sync web assets into the iOS project
        run: npx cap sync ios

      - name: Verify bundled web assets
        run: |
          public="ios/App/App/public"
          for f in index.html manifest.json sw.js kjv.json web.verses.txt; do
            if [ ! -s "$public/$f" ]; then
              echo "::error::$public/$f missing or empty after cap sync"
              exit 1
            fi
          done

      # Inputs go through env, never interpolated straight into the script, and
      # are shape-checked before they reach xcodebuild.
      - name: Resolve version and build number
        id: version
        env:
          IN_VERSION: ${{ inputs.marketing_version }}
          IN_BUILD: ${{ inputs.build_number }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          build="${IN_BUILD:-$RUN_NUMBER}"
          version="${IN_VERSION:-}"
          if [ -z "$version" ]; then
            version=$(grep -m1 'MARKETING_VERSION' ios/App/App.xcodeproj/project.pbxproj \
                      | sed -E 's/.*= *([^;]+);.*/\1/' | tr -d ' ')
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+(\.[0-9]+){0,2}$'; then
            echo "::error::marketing_version must look like 1 / 1.2 / 1.2.3, got '$version'"
            exit 1
          fi
          if ! printf '%s' "$build" | grep -Eq '^[0-9]+(\.[0-9]+){0,2}$'; then
            echo "::error::build_number must be numeric, got '$build'"
            exit 1
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building $version ($build)"

      - name: Import signing certificate and provisioning profile
        env:
          CERT_P12: ${{ secrets.APPLE_DIST_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_DIST_CERT_PASSWORD }}
          PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail
          if [ -z "${CERT_P12:-}" ] || [ -z "${PROFILE:-}" ]; then
            echo "::error::APPLE_DIST_CERT_P12 / APPLE_PROVISIONING_PROFILE are not set. See docs/ios-ci-setup.md"
            exit 1
          fi

          cert_path="$RUNNER_TEMP/dist.p12"
          profile_path="$RUNNER_TEMP/profile.mobileprovision"
          echo "$CERT_P12" | base64 --decode > "$cert_path"
          echo "$PROFILE"  | base64 --decode > "$profile_path"

          # Dedicated throwaway keychain, unlocked for this job only.
          keychain="$RUNNER_TEMP/build.keychain-db"
          keychain_password=$(uuidgen)
          echo "KEYCHAIN_PATH=$keychain" >> "$GITHUB_ENV"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$cert_path" -k "$keychain" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychain -d user -s "$keychain" login.keychain-db

          # Xcode 15 and earlier read provisioning profiles from the
          # MobileDevice path; Xcode 16+ reads the Xcode UserData path. Install
          # into both so this does not depend on the runner's Xcode version.
          uuid=$(security cms -D -i "$profile_path" | plutil -extract UUID raw -o - -)
          name=$(security cms -D -i "$profile_path" | plutil -extract Name raw -o - -)
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" \
                     "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$profile_path" "$dir/$uuid.mobileprovision"
          done
          echo "PROVISIONING_PROFILE_NAME=$name" >> "$GITHUB_ENV"
          echo "Installed profile '$name' ($uuid)"

          rm -f "$cert_path"
          security find-identity -v -p codesigning "$keychain"

      - name: Archive
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -z "${TEAM_ID:-}" ]; then
            echo "::error::APPLE_TEAM_ID is not set. See docs/ios-ci-setup.md"
            exit 1
          fi
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROVISIONING_PROFILE_NAME" \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.build }}" \
            archive

      - name: Export .ipa
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>export</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$APP_BUNDLE_ID</key>
              <string>$PROVISIONING_PROFILE_NAME</string>
            </dict>
            <key>uploadSymbols</key>
            <true/>
            <key>stripSwiftSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

          ls -lh "$RUNNER_TEMP/export"

      - name: Upload .ipa as a workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: verse-advocate-${{ steps.version.outputs.version }}-${{ steps.version.outputs.build }}
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 30
          if-no-files-found: error

      - name: Upload to App Store Connect
        if: ${{ inputs.upload }}
        env:
          KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          ASC_APP_ID: ${{ secrets.APPSTORE_APP_ID }}
        run: |
          set -euo pipefail
          if [ -z "${KEY_ID:-}" ] || [ -z "${ISSUER_ID:-}" ] || [ -z "${PRIVATE_KEY:-}" ]; then
            echo "::error::App Store Connect API secrets are not set. The .ipa is attached to this run as an artifact; see docs/ios-ci-setup.md"
            exit 1
          fi
          if [ -z "${ASC_APP_ID:-}" ]; then
            echo "::error::APPSTORE_APP_ID is not set — create the app record in App Store Connect first, then copy its numeric Apple ID. The .ipa is attached to this run as an artifact."
            exit 1
          fi

          # altool looks for the key in this exact location, by key id.
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          key_file="$HOME/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8"
          echo "$PRIVATE_KEY" | base64 --decode > "$key_file"
          chmod 600 "$key_file"

          ipa=$(ls "$RUNNER_TEMP/export"/*.ipa | head -1)

          # --validate-package / --upload-package, not the deprecated
          # --validate-app / --upload-app.
          xcrun altool --validate-package "$ipa" \
            --type ios \
            --apple-id "$ASC_APP_ID" \
            --bundle-id "$APP_BUNDLE_ID" \
            --bundle-version "${{ steps.version.outputs.build }}" \
            --bundle-short-version-string "${{ steps.version.outputs.version }}" \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"

          xcrun altool --upload-package "$ipa" \
            --type ios \
            --apple-id "$ASC_APP_ID" \
            --bundle-id "$APP_BUNDLE_ID" \
            --bundle-version "${{ steps.version.outputs.build }}" \
            --bundle-short-version-string "${{ steps.version.outputs.version }}" \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"

          echo "Uploaded ${{ steps.version.outputs.version }} (${{ steps.version.outputs.build }}). TestFlight processing takes 10-30 minutes."

      - name: Remove signing material from the runner
        if: always()
        run: |
          security delete-keychain "${KEYCHAIN_PATH:-$RUNNER_TEMP/build.keychain-db}" 2>/dev/null || true
          rm -rf "$HOME/.appstoreconnect/private_keys" \
                 "$HOME/Library/MobileDevice/Provisioning Profiles" \
                 "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" || true
