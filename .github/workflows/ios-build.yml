name: iOS build check

# Compiles the app for the simulator with signing disabled, so it needs no
# secrets and no Apple account. Catches the things that actually break this
# project: a bad cap sync, storyboard/asset-catalog errors, Swift that no
# longer compiles against the pinned capacitor-swift-pm.
#
# macOS runners bill at a 10x minute multiplier on private repos, so this is
# scoped to pushes that touch the native/web payload rather than every commit.

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'www/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - '.github/workflows/ios-build.yml'
  pull_request:
    paths:
      - 'ios/**'
      - 'www/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - run: npm ci

      - name: Sync web assets into the iOS project
        run: npx cap sync ios

      # ios/App/App/public is gitignored and generated by cap sync. If it is
      # missing or empty the app still builds, then launches to a blank white
      # screen — so fail loudly here instead.
      - name: Verify bundled web assets
        run: |
          public="ios/App/App/public"
          for f in index.html manifest.json sw.js kjv.json web.verses.txt; do
            if [ ! -s "$public/$f" ]; then
              echo "::error::$public/$f missing or empty after cap sync"
              exit 1
            fi
          done
          echo "Bundled web payload: $(du -sh "$public" | cut -f1)"

      - name: Build for simulator
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
